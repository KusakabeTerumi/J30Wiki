<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">前列・中列・後列の考え方</title><desc id="svgdesc">役割だけでなく、有効距離とスキル条件を確認する。J30 Wiki 初心者向けの模式図。</desc>
<rect x="0" y="0" width="1280" height="720" rx="14" fill="#111827"/>
<circle cx="1200" cy="65" r="170" fill="#A78BFA" opacity="0.04"/>
<rect x="48" y="37" width="12" height="78" rx="6" fill="#A78BFA"/>
<text x="85" y="80" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="40" font-weight="700" fill="#F8FAFC" text-anchor="start" dominant-baseline="middle" opacity="1">前列・中列・後列の考え方</text>
<text x="86" y="123" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">役割だけでなく、有効距離とスキル条件を確認する</text>
<text x="1230" y="65" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#C4B5FD" text-anchor="end" dominant-baseline="middle" opacity="1">J30 WIKI</text>
<text x="1230" y="100" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="400" fill="#9EADC4" text-anchor="end" dominant-baseline="middle" opacity="1">編成の基本</text>
<line x1="48" y1="153" x2="1232" y2="153" stroke="#41516A" stroke-width="1" stroke-linecap="round"/>
<line x1="48" y1="665" x2="1232" y2="665" stroke="#41516A" stroke-width="1" stroke-linecap="round"/>
<text x="50" y="691" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">J30sym  ・  初心者育成ガイド</text>
<text x="1230" y="691" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" fill="#9EADC4" text-anchor="end" dominant-baseline="middle" opacity="1">※ 模式図：ゲーム画面ではありません</text>
<rect x="57" y="204" width="368" height="309" rx="17" fill="#1C2940" stroke="#41516A" stroke-width="1"/>
<rect x="85" y="229" width="115" height="39" rx="20" fill="#222F46" stroke="#67E8F9" stroke-width="1"/>
<text x="142.5" y="249" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="19" font-weight="700" fill="#67E8F9" text-anchor="middle" dominant-baseline="middle" opacity="1">前列</text>
<text x="84" y="330" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC" text-anchor="start" dominant-baseline="middle" opacity="1">耐久・防御</text>
<text x="84" y="389" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">ダメージ軽減</text>
<text x="84" y="431" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">回復などを確認</text>
<rect x="451" y="204" width="368" height="309" rx="17" fill="#1C2940" stroke="#41516A" stroke-width="1"/>
<rect x="479" y="229" width="115" height="39" rx="20" fill="#222F46" stroke="#A78BFA" stroke-width="1"/>
<text x="536.5" y="249" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="19" font-weight="700" fill="#A78BFA" text-anchor="middle" dominant-baseline="middle" opacity="1">中列</text>
<text x="478" y="330" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC" text-anchor="start" dominant-baseline="middle" opacity="1">攻撃・支援</text>
<text x="478" y="389" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">味方への強化</text>
<text x="478" y="431" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">敵への妨害など</text>
<rect x="845" y="204" width="368" height="309" rx="17" fill="#1C2940" stroke="#41516A" stroke-width="1"/>
<rect x="873" y="229" width="115" height="39" rx="20" fill="#222F46" stroke="#6EE7B7" stroke-width="1"/>
<text x="930.5" y="249" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="19" font-weight="700" fill="#6EE7B7" text-anchor="middle" dominant-baseline="middle" opacity="1">後列</text>
<text x="872" y="330" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC" text-anchor="start" dominant-baseline="middle" opacity="1">主力火力</text>
<text x="872" y="389" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">有効距離の長い</text>
<text x="872" y="431" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">攻撃スキルなど</text>
<rect x="55" y="582" width="1170" height="39" rx="14" fill="#28324B"/>
<text x="640" y="602" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#C4B5FD" text-anchor="middle" dominant-baseline="middle" opacity="1">同じ特化アリでも、配置変更でスキルが届く相手や効果が変わる場合があります。</text>
</svg>