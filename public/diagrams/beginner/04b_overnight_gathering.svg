<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">前夜からの採集準備</title><desc id="svgdesc">帰還のタイミングを、採集ポイント対象の時間帯に合わせる。J30 Wiki 初心者向けの模式図。</desc>
<rect x="0" y="0" width="1280" height="720" rx="14" fill="#111827"/>
<circle cx="1200" cy="65" r="170" fill="#A78BFA" opacity="0.04"/>
<rect x="48" y="37" width="12" height="78" rx="6" fill="#A78BFA"/>
<text x="85" y="80" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="40" font-weight="700" fill="#F8FAFC" text-anchor="start" dominant-baseline="middle" opacity="1">前夜からの採集準備</text>
<text x="86" y="123" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">帰還のタイミングを、採集ポイント対象の時間帯に合わせる</text>
<text x="1230" y="65" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#C4B5FD" text-anchor="end" dominant-baseline="middle" opacity="1">J30 WIKI</text>
<text x="1230" y="100" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="400" fill="#9EADC4" text-anchor="end" dominant-baseline="middle" opacity="1">最強戦域戦</text>
<line x1="48" y1="153" x2="1232" y2="153" stroke="#41516A" stroke-width="1" stroke-linecap="round"/>
<line x1="48" y1="665" x2="1232" y2="665" stroke="#41516A" stroke-width="1" stroke-linecap="round"/>
<text x="50" y="691" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">J30sym  ・  初心者育成ガイド</text>
<text x="1230" y="691" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" fill="#9EADC4" text-anchor="end" dominant-baseline="middle" opacity="1">※ 模式図：ゲーム画面ではありません</text>
<rect x="54" y="196" width="1170" height="320" rx="18" fill="#1C2940" stroke="#41516A" stroke-width="1"/>
<line x1="135" y1="343" x2="1133" y2="343" stroke="#41516A" stroke-width="5" stroke-linecap="round"/>
<circle cx="164" cy="343" r="16" fill="#67E8F9" opacity="1"/>
<text x="164" y="251" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="24" font-weight="700" fill="#67E8F9" text-anchor="middle" dominant-baseline="middle" opacity="1">月曜夜</text>
<text x="164" y="403" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" text-anchor="middle" dominant-baseline="middle" opacity="1">採集部隊を派遣</text>
<circle cx="490" cy="343" r="16" fill="#A78BFA" opacity="1"/>
<text x="490" y="251" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="24" font-weight="700" fill="#A78BFA" text-anchor="middle" dominant-baseline="middle" opacity="1">火曜・開始前</text>
<text x="490" y="403" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" text-anchor="middle" dominant-baseline="middle" opacity="1">採集を継続する</text>
<circle cx="824" cy="343" r="16" fill="#6EE7B7" opacity="1"/>
<text x="824" y="251" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="24" font-weight="700" fill="#6EE7B7" text-anchor="middle" dominant-baseline="middle" opacity="1">イベント開始後</text>
<text x="824" y="403" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" text-anchor="middle" dominant-baseline="middle" opacity="1">ポイント対象を確認</text>
<circle cx="1134" cy="343" r="16" fill="#FDE68A" opacity="1"/>
<text x="1134" y="251" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="24" font-weight="700" fill="#FDE68A" text-anchor="middle" dominant-baseline="middle" opacity="1">確認後</text>
<text x="1134" y="403" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" text-anchor="middle" dominant-baseline="middle" opacity="1">部隊を帰還</text>
<rect x="95" y="464" width="1085" height="43" rx="11" fill="#2D3450"/>
<text x="640" y="485" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#CFD8E5" text-anchor="middle" dominant-baseline="middle" opacity="1">例：月曜夜にLv.7の資源地へT2キャリヤーを派遣</text>
<rect x="62" y="545" width="1155" height="69" rx="13" fill="#273A48" stroke="#41516A" stroke-width="1"/>
<text x="640" y="571" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="23" font-weight="700" fill="#6EE7B7" text-anchor="middle" dominant-baseline="middle" opacity="1">土曜日を採集にする場合は、金曜夜から同様に準備</text>
<text x="640" y="601" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="400" fill="#CFD8E5" text-anchor="middle" dominant-baseline="middle" opacity="1">帰還が早まる場合があるため、採集完了までの時間を事前に確認</text>
</svg>