<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">特化アリのスキル育成</title><desc id="svgdesc">兵数の確保と攻撃スキルの相性を、別々に確認する。J30 Wiki 初心者向けの模式図。</desc>
<rect x="0" y="0" width="1280" height="720" rx="14" fill="#111827"/>
<circle cx="1200" cy="65" r="170" fill="#A78BFA" opacity="0.04"/>
<rect x="48" y="37" width="12" height="78" rx="6" fill="#A78BFA"/>
<text x="85" y="80" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="40" font-weight="700" fill="#F8FAFC" text-anchor="start" dominant-baseline="middle" opacity="1">特化アリのスキル育成</text>
<text x="86" y="123" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">兵数の確保と攻撃スキルの相性を、別々に確認する</text>
<text x="1230" y="65" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#C4B5FD" text-anchor="end" dominant-baseline="middle" opacity="1">J30 WIKI</text>
<text x="1230" y="100" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="400" fill="#9EADC4" text-anchor="end" dominant-baseline="middle" opacity="1">特化アリの基本</text>
<line x1="48" y1="153" x2="1232" y2="153" stroke="#41516A" stroke-width="1" stroke-linecap="round"/>
<line x1="48" y1="665" x2="1232" y2="665" stroke="#41516A" stroke-width="1" stroke-linecap="round"/>
<text x="50" y="691" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">J30sym  ・  初心者育成ガイド</text>
<text x="1230" y="691" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="400" fill="#9EADC4" text-anchor="end" dominant-baseline="middle" opacity="1">※ 模式図：ゲーム画面ではありません</text>
<rect x="56" y="196" width="553" height="337" rx="16" fill="#1C2940" stroke="#41516A" stroke-width="1"/>
<rect x="57" y="197" width="7" height="335" rx="3" fill="#A78BFA"/>
<text x="80" y="229" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="19" font-weight="700" fill="#A78BFA" text-anchor="start" dominant-baseline="middle" opacity="1">まず確認</text>
<text x="80" y="279" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="37" font-weight="700" fill="#F8FAFC" text-anchor="start" dominant-baseline="middle" opacity="1">スキル1・6</text>
<text x="80" y="328" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">出征兵隊アリ数に関係</text>
<text x="80" y="360" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">主力の解放状況を確認</text>
<text x="80" y="392" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">解放優先と最大Lv強化は別</text>
<rect x="639" y="196" width="584" height="337" rx="16" fill="#1C2940" stroke="#41516A" stroke-width="1"/>
<rect x="640" y="197" width="7" height="335" rx="3" fill="#6EE7B7"/>
<text x="663" y="229" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="19" font-weight="700" fill="#6EE7B7" text-anchor="start" dominant-baseline="middle" opacity="1">次に確認</text>
<text x="663" y="279" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="31" font-weight="700" fill="#F8FAFC" text-anchor="start" dominant-baseline="middle" opacity="1">戦闘スキルの相性</text>
<text x="663" y="328" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">スキル2・5・8など</text>
<text x="663" y="360" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">有効距離・発動条件・連携</text>
<text x="663" y="392" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="400" fill="#CFD8E5" text-anchor="start" dominant-baseline="middle" opacity="1">素材は主力隊列へ優先配分</text>
<rect x="55" y="590" width="1170" height="39" rx="14" fill="#28324B"/>
<text x="640" y="610" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="700" fill="#C4B5FD" text-anchor="middle" dominant-baseline="middle" opacity="1">無課金の実践例：新しい特化アリは「既存主力との相性」で評価</text>
</svg>